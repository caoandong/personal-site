name: Public game
on: deployment_status
permissions:
  contents: read

jobs:
  live:
    name: Check public game
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production' && github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-game.mjs https://antoniocao.com/return-of-the-king
